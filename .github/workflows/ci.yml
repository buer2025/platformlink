name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pl
          POSTGRES_PASSWORD: pl
          POSTGRES_DB: pltest
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . --exclude migrations
      - name: Tests (SQLite)
        run: uv run pytest -q
      - name: Tests (PostgreSQL)
        run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://pl:pl@localhost/pltest
      - name: Migrations match models
        run: |
          PGPASSWORD=pl psql -h localhost -U pl -d pltest -c 'CREATE DATABASE pltest_mig'
          uv run alembic upgrade head && uv run alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://pl:pl@localhost/pltest_mig

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd backend && uv sync --frozen
      - run: npm i -g playwright@1 && npx playwright install --with-deps chromium
      - run: NODE_PATH=$(npm root -g) ./e2e/run.sh
