services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platformlink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platformlink}
      POSTGRES_DB: platformlink
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platformlink"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://platformlink:${POSTGRES_PASSWORD:-platformlink}@db/platformlink
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
